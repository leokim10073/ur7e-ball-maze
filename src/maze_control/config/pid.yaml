# PID ball controller. Every gain, limit, topic and sign lives here.
# Board frame: origin at the maze centre, x right, y up (seen from the
# overhead camera). Lengths in m, angles in deg unless noted.
maze_pid_controller:
  ros__parameters:
    rate_hz: 60.0

    topics:
      state: /ball/state          # nav_msgs/Odometry: pose.position.x/y, twist.linear.x/y
      path: /maze/path            # nav_msgs/Path, board frame
      tilt_cmd: /board/tilt_cmd   # geometry_msgs/Vector3Stamped, x=theta_x, y=theta_y [rad]
    frame_id: maze_board         # same board frame as perception and the sim

    # Sign of the ball acceleration produced by a positive board angle.
    #   theta_y > 0 -> ball accelerates towards +x  =>  theta_y_to_ax: +1
    #   theta_x > 0 -> ball accelerates towards -y  =>  theta_x_to_ay: -1
    sign:
      theta_y_to_ax: 1.0
      theta_x_to_ay: -1.0

    limits:
      max_tilt_deg: 5.0           # per axis
      max_rate_deg_s: 30.0        # per axis

    # u = kp*e - kd*v + ki*int(e), u in rad, e in m, v in m/s (from the KF)
    pid:
      kp: 1.4                     # rad / m
      kd: 0.55                    # rad / (m/s)
      ki: 0.6                     # rad / (m s)
      i_zone: 0.02                # integrate only while |e| < i_zone [m]
      i_max_deg: 1.0              # cap on the integral term

    tracker:
      lookahead: 0.05             # L [m]
      goal_tol: 0.02              # within this of the goal: stop advancing [m]
      search_ahead: 0.15          # projection window ahead of progress [m]
      search_back: 0.02           # projection window behind progress [m]

    watchdog:
      state_timeout: 0.2          # no /ball/state for this long -> tilt to 0 [s]
