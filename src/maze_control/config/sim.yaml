# Offline simulator (maze_control.common.ball_sim) used by the tests and plots.
# Ball: 14 mm solid steel sphere, rolling without slipping -> a = (5/7) g sin(theta).
ball_sim:
  ros__parameters:
    c: 0.3              # viscous rolling loss [1/s]
    tau: 0.08           # first-order tilt lag of the arm [s]
    delay: 0.05         # command delay (camera + KF + arm) [s]
    dt_phys: 0.001      # integration step [s]
    noise_pos: 0.0      # measured position noise, std [m]
    noise_vel: 0.0      # measured velocity noise, std [m/s]
    # The true plant signs. The controller's signs in pid.yaml must match.
    sign:
      theta_y_to_ax: 1.0
      theta_x_to_ay: -1.0
