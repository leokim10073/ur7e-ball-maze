# Perception settings. All keys are required.
# Board frame = the sim's board frame (maze_CAD/README.md): origin at the plate center, z up,
# z = 0 on the maze floor, handle on the -x edge, units m.

aruco:
  dictionary: DICT_4X4_50            # maze_CAD/scripts/maze_params.py -> ARUCO
  marker_size: 0.040                 # black square side, m (the white quiet zone is not part of it)
  # Marker centers in the board frame (maze_CAD/levels/<L>/sim/parts_report.json -> aruco.markers).
  # Each marker's image top edge faces board +y. The same four markers go on every level.
  markers:
    0: [-0.121,  0.179, 0.0001]      # TL
    1: [ 0.121,  0.179, 0.0001]      # TR
    2: [ 0.121, -0.179, 0.0001]      # BR
    3: [-0.121, -0.179, 0.0001]      # BL

pose:
  # Fewer markers than this -> no board pose for the frame. With 3 of the 4, points on the board are
  # within 1 mm; with 2, the tilt is ambiguous (up to 7 deg, 6.6 mm off on a 5 deg tilted board).
  min_markers: 3
  max_reprojection_px: 3.0           # reject a pose whose worst corner reprojects farther than this

rectified:
  x_range: [-0.150, 0.150]           # board area drawn in the rectified image, m (the 300 x 300 plate)
  y_range: [-0.150, 0.150]
  px_per_m: 2000.0                   # 2 px/mm -> 600 x 600 image; image x = board +x, image up = board +y

ball:
  # Found in the image rectified at z = radius (the ball center's plane, contract 2): a pixel whose
  # color is at least `not_floor` (CIELAB distance) from the floor's counts as not floor; the ball
  # is the disc of its size that is most not-floor compared with the ring around it.
  radius: 0.007                      # m (sim.yaml ball.radius; the steel ball on the real board)
  floor: [-0.141, 0.141, -0.141, 0.141]   # x_min, x_max, y_min, y_max inside the outer walls, m (CAD, checked by a test)
  wall_height: 0.018                 # m (CAD wall_h): walls from /maze/map are left out up to this height
  not_floor: 20.0                    # CIELAB distance; sim ball 29-60 from the floor, floor noise below
  min_score: 0.5                     # disc minus ring share of not-floor pixels, 0..1; less -> no ball

tracking:
  # Constant-velocity Kalman filter on the ball measurements (ball_filter.py), at each image's
  # capture time. /ball/state carries its state; controllers predict forward from the stamp.
  accel_noise: 1.0                   # m/s^2; lower: steadier speed for a slow ball, slower to follow a wall stop (README)
  measurement_noise: 0.001           # m per axis (sim: 0.5 mm mean, 1.8 mm worst)
  initial_speed: 0.3                 # m/s, velocity uncertainty of a new track
  max_jump: 0.02                     # m beyond the prediction (+ 3 sigma): a misdetection, not used
  max_rejects: 3                     # misdetections in a row -> restart the track at the measurement
  lost_reset: 1.0                    # s without the ball -> forget it rather than extrapolate
