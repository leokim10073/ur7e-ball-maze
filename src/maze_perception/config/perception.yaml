# Perception settings. All keys are required.
# Board frame = the sim's board frame (maze_CAD/README.md): origin at the plate center, z up,
# z = 0 on the maze floor, handle on the -x edge, units m.

aruco:
  dictionary: DICT_4X4_50            # maze_CAD/scripts/maze_params.py -> ARUCO
  marker_size: 0.040                 # black square side, m (the white quiet zone is not part of it)
  # Marker centers in the board frame (maze_CAD/levels/<L>/sim/parts_report.json -> aruco.markers).
  # Each marker's image top edge faces board +y. The same four markers go on every level.
  markers:
    0: [-0.121,  0.179, 0.0001]      # TL
    1: [ 0.121,  0.179, 0.0001]      # TR
    2: [ 0.121, -0.179, 0.0001]      # BR
    3: [-0.121, -0.179, 0.0001]      # BL

pose:
  # Fewer markers than this -> no board pose for the frame. With 3 of the 4, points on the board are
  # within 1 mm; with 2, the tilt is ambiguous (up to 7 deg, 6.6 mm off on a 5 deg tilted board).
  min_markers: 3
  max_reprojection_px: 3.0           # reject a pose whose worst corner reprojects farther than this

rectified:
  x_range: [-0.150, 0.150]           # board area drawn in the rectified image, m (the 300 x 300 plate)
  y_range: [-0.150, 0.150]
  px_per_m: 2000.0                   # 2 px/mm -> 600 x 600 image; image x = board +x, image up = board +y

maze:
  # Board geometry shared by every level (maze_CAD/scripts/maze_params.py, checked by a test).
  plate: 0.300                       # base plate side, m; centered on the board origin
  margin: 0.003                      # lip between the plate edge and the outer wall
  wall_thickness: 0.006
  # Map output (docs/interfaces.md, contract 1): 5 mm cells over the plate, row 0 on the -y edge.
  resolution: 0.005
  # Wall detection. Each wall segment between two grid nodes gets a darkness score from the
  # rectified image: how far below the floor's gray level its darkest line lies (median along it).
  # In the sim (L1, board tilted up to 6 deg): inner walls score >= 31, empty segments 0.
  search_margin: 0.003               # look this far on each side of a wall's footprint (parallax, pose error)
  wall_contrast: 15.0                # a segment with a score >= this is a wall; outer walls below it -> no map
  level: L1
  # Per-level layout (maze_CAD/scripts/levels.py). Rows count from the TOP (+y edge), columns from
  # the left (-x edge), as in the CAD. Start, goal and holes are given, not detected; walls are detected.
  levels:
    L1:
      n: 6                           # n x n cells
      cell: 0.042                    # cell size between walls, m
      start: [0, 0]                  # (row, col)
      goal: [4, 5]                   # (row, col)
      goal_radius: 0.015
      holes: []                      # [row, col, diameter_m] trap holes
